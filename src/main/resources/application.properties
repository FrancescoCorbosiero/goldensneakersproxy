spring.application.name=goldensneakersproxy

# Server configuration
server.port=${SERVER_PORT:8080}

# GoldenSneakers API configuration
goldensneakers.base-url=${GOLDENSNEAKERS_BASE_URL:https://www.goldensneakers.net/api}
goldensneakers.jwt-token=${GOLDENSNEAKERS_JWT_TOKEN:JWT_TOKEN}

# Proxy Basic Auth configuration
proxy.auth.username=${PROXY_AUTH_USERNAME:shopify}
proxy.auth.password=${PROXY_AUTH_PASSWORD:password}

# WebClient configuration for large responses
spring.codec.max-in-memory-size=50MB

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.it.alpacode.goldensneakersproxy=DEBUG

# Database configuration
# H2 (in-memory, for development/testing)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:woodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (only for development)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# WordPress / WooCommerce API configuration
wordpress.base-url=${WORDPRESS_BASE_URL:https://your-site.com}
wordpress.consumer-key=${WORDPRESS_CONSUMER_KEY:ck_xxx}
wordpress.consumer-secret=${WORDPRESS_CONSUMER_SECRET:cs_xxx}

# Static taxonomies for pre-import (comma-separated)
wordpress.categories=${WORDPRESS_CATEGORIES:Sneakers,Running,Basketball,Lifestyle,Skateboarding}
wordpress.brands=${WORDPRESS_BRANDS:Nike,Adidas,New Balance,Puma,Converse}
wordpress.attributes=${WORDPRESS_ATTRIBUTES:Color,Size}

# Assortment Mapper configuration
assortment-mapper.default-category=${ASSORTMENT_MAPPER_DEFAULT_CATEGORY:Sneakers}
assortment-mapper.size-attribute-name=${ASSORTMENT_MAPPER_SIZE_ATTRIBUTE:Size}
assortment-mapper.markup-percentage=${ASSORTMENT_MAPPER_MARKUP:47}
