spring.application.name=goldensneakersproxy

# Server configuration
server.port=${SERVER_PORT:8080}

# GoldenSneakers API configuration
goldensneakers.base-url=${GOLDENSNEAKERS_BASE_URL:https://www.goldensneakers.net/api}
goldensneakers.jwt-token=${GOLDENSNEAKERS_JWT_TOKEN:JWT_TOKEN}

# Proxy Basic Auth configuration
proxy.auth.username=${PROXY_AUTH_USERNAME:shopify}
proxy.auth.password=${PROXY_AUTH_PASSWORD:password}

# WebClient configuration for large responses
spring.codec.max-in-memory-size=50MB

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.it.alpacode.goldensneakersproxy=DEBUG

# ===================================
# WooCommerce Shop Configuration
# ===================================

# Shop base URL (e.g., https://your-shop.com)
shop.base-url=${SHOP_URL:}

# WooCommerce REST API
shop.woocommerce.consumer-key=${WC_CONSUMER_KEY:}
shop.woocommerce.consumer-secret=${WC_CONSUMER_SECRET:}
shop.woocommerce.batch-size=100
shop.woocommerce.timeout=60000
shop.woocommerce.rate-limit-delay-ms=2000
