spring.application.name=goldensneakersproxy

# Server configuration
server.port=${SERVER_PORT:8080}

# GoldenSneakers API configuration
goldensneakers.api-url=${GOLDENSNEAKERS_API_URL:https://www.goldensneakers.net/api/assortment/}
goldensneakers.jwt-token=${GOLDENSNEAKERS_JWT_TOKEN:}

# Proxy Basic Auth configuration
proxy.auth.username=${PROXY_AUTH_USERNAME:shopify}
proxy.auth.password=${PROXY_AUTH_PASSWORD:changeme}

# WebClient configuration for large responses
spring.codec.max-in-memory-size=50MB

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.it.alpacode.goldensneakersproxy=DEBUG
