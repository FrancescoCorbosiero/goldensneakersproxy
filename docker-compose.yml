version: '3.8'

services:
  goldensneakers-proxy:
    build: .
    container_name: goldensneakers-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GOLDENSNEAKERS_API_URL=${GOLDENSNEAKERS_API_URL}
      - GOLDENSNEAKERS_JWT_TOKEN=${GOLDENSNEAKERS_JWT_TOKEN}
      - PROXY_AUTH_USERNAME=${PROXY_AUTH_USERNAME}
      - PROXY_AUTH_PASSWORD=${PROXY_AUTH_PASSWORD}
      - SERVER_PORT=8080
    networks:
      - caddy_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  caddy_network:
    external: true
