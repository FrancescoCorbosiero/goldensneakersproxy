version: '3.8'

services:
  app:
    build: .
    image: goldensneakers-proxy:latest
    container_name: goldensneakers-proxy
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # GoldenSneakers API
      GOLDENSNEAKERS_API_URL: ${GOLDENSNEAKERS_API_URL}
      GOLDENSNEAKERS_JWT_TOKEN: ${GOLDENSNEAKERS_JWT_TOKEN}

      # Basic Auth credentials (for Import Wizard Pro)
      PROXY_AUTH_USERNAME: ${PROXY_AUTH_USERNAME}
      PROXY_AUTH_PASSWORD: ${PROXY_AUTH_PASSWORD}

      # WordPress / WooCommerce API
      WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL}
      WORDPRESS_CONSUMER_KEY: ${WORDPRESS_CONSUMER_KEY}
      WORDPRESS_CONSUMER_SECRET: ${WORDPRESS_CONSUMER_SECRET}
      WORDPRESS_CATEGORIES: ${WORDPRESS_CATEGORIES:-}
      WORDPRESS_BRANDS: ${WORDPRESS_BRANDS:-}
      WORDPRESS_ATTRIBUTES: ${WORDPRESS_ATTRIBUTES:-}

    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - caddy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy-network:
    external: true
    name: caddy-network
